  <!-- ===================== DIVIDER ===================== -->
  <line x1="620" y1="40" x2="620" y2="664" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===================== PANEL C (right) ===================== -->
  <g>
    <!-- panel title -->
    <text x="680" y="56" font-size="22" font-weight="700" fill="#0F172A">Option C · Fan-out + weighted rank fusion</text>

    <!-- search query box -->
    <rect x="790" y="84" width="280" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="815" cy="105" r="7" fill="none" stroke="#64748B" stroke-width="2"/>
    <line x1="820" y1="110" x2="826" y2="116" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
