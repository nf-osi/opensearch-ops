    <rect x="752" y="284" width="356" height="56" rx="12" fill="#FFF3EC" stroke="#EA580C" stroke-width="2"/>
    <text x="930" y="308" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">weighted rank fusion</text>
    <text x="930" y="328" font-size="13" fill="#9A3412" text-anchor="middle">score = &#931; w&#7522; / (k + rank)</text>

    <!-- arrow fusion -> blended list -->
    <path d="M930,340 L930,372" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrowDark)"/>

    <!-- blended results frame -->
    <rect x="700" y="380" width="460" height="288" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="716" y="404" font-size="14" font-weight="700" fill="#0F172A">Results</text>
    <text x="1144" y="404" font-size="12" font-weight="600" fill="#64748B" text-anchor="end">one blended list</text>

    <!-- 5 mixed cards with type tags -->
    <!-- card 1 - Dataset -->
    <g>
      <rect x="716" y="416" width="428" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3"/>
      <rect x="730" y="430" width="74" height="16" rx="8" fill="#2563EB"/>
      <text x="767" y="442" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dataset</text>
      <rect x="818" y="431" width="250" height="9" rx="4.5" fill="#334155" opacity="0.55"/>
      <rect x="818" y="445" width="180" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    </g>
    <!-- card 2 - Tools -->
    <g>
      <rect x="716" y="466" width="428" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3"/>
      <rect x="730" y="480" width="56" height="16" rx="8" fill="#0E8C7F"/>
      <text x="758" y="492" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tools</text>
      <rect x="800" y="481" width="270" height="9" rx="4.5" fill="#334155" opacity="0.55"/>
      <rect x="800" y="495" width="150" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    </g>
    <!-- card 3 - Publication -->
    <g>
      <rect x="716" y="516" width="428" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3"/>
      <rect x="730" y="530" width="86" height="16" rx="8" fill="#7C3AED"/>
      <text x="773" y="542" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Publication</text>
      <rect x="830" y="531" width="238" height="9" rx="4.5" fill="#334155" opacity="0.55"/>
      <rect x="830" y="545" width="170" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    </g>
    <!-- card 4 - Tools -->
    <g>
      <rect x="716" y="566" width="428" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3"/>
      <rect x="730" y="580" width="56" height="16" rx="8" fill="#0E8C7F"/>
      <text x="758" y="592" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tools</text>
      <rect x="800" y="581" width="210" height="9" rx="4.5" fill="#334155" opacity="0.55"/>
      <rect x="800" y="595" width="140" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    </g>
    <!-- card 5 - Dataset -->
    <g>
      <rect x="716" y="616" width="428" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3"/>
      <rect x="730" y="630" width="74" height="16" rx="8" fill="#2563EB"/>
      <text x="767" y="642" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dataset</text>
      <rect x="818" y="631" width="255" height="9" rx="4.5" fill="#334155" opacity="0.55"/>
      <rect x="818" y="645" width="160" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    </g>
  </g>

  <!-- sublabel for C (placed below frame area, aligned) -->
  <text x="700" y="690" font-size="12.5" fill="#64748B">single blended list · relevance layer = per-type weights w&#7522;</text>

  <!-- footer caption -->
  <text x="620" y="712" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">B keeps results grouped by type; C merges them into one relevance-ranked list.</text>
</svg>
