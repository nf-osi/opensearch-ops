    <path d="M930,126 L930,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M980,126 L1090,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- index cylinders -->
    <!-- Tools -->
