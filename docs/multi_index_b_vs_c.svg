    <path d="M110,215 L260,300" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M310,215 L310,300" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M510,215 L360,300" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- results frame -->
    <rect x="80" y="312" width="460" height="356" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- tab bar -->
    <!-- active tab: Tools -->
    <rect x="96" y="328" width="130" height="38" rx="9" fill="#0E8C7F"/>
    <text x="161" y="352" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tools (12)</text>
    <!-- inactive tab: Datasets -->
    <rect x="234" y="328" width="142" height="38" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="305" y="352" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">Datasets (8)</text>
    <!-- inactive tab: Publications -->
    <rect x="384" y="328" width="140" height="38" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="454" y="352" font-size="13" font-weight="600" fill="#7C3AED" text-anchor="middle">Publications (30)</text>

    <!-- active-type list: 4 cards all Tools color -->
    <g>
      <rect x="96" y="386" width="428" height="56" rx="9" fill="#F0FAF8" stroke="#0E8C7F" stroke-width="1.4"/>
      <rect x="96" y="386" width="6" height="56" rx="3" fill="#0E8C7F"/>
      <rect x="118" y="402" width="240" height="10" rx="5" fill="#0E8C7F" opacity="0.85"/>
      <rect x="118" y="420" width="330" height="8" rx="4" fill="#0E8C7F" opacity="0.30"/>

      <rect x="96" y="450" width="428" height="56" rx="9" fill="#F0FAF8" stroke="#0E8C7F" stroke-width="1.4"/>
      <rect x="96" y="450" width="6" height="56" rx="3" fill="#0E8C7F"/>
      <rect x="118" y="466" width="200" height="10" rx="5" fill="#0E8C7F" opacity="0.85"/>
      <rect x="118" y="484" width="300" height="8" rx="4" fill="#0E8C7F" opacity="0.30"/>

      <rect x="96" y="514" width="428" height="56" rx="9" fill="#F0FAF8" stroke="#0E8C7F" stroke-width="1.4"/>
      <rect x="96" y="514" width="6" height="56" rx="3" fill="#0E8C7F"/>
      <rect x="118" y="530" width="270" height="10" rx="5" fill="#0E8C7F" opacity="0.85"/>
      <rect x="118" y="548" width="310" height="8" rx="4" fill="#0E8C7F" opacity="0.30"/>

      <rect x="96" y="578" width="428" height="56" rx="9" fill="#F0FAF8" stroke="#0E8C7F" stroke-width="1.4"/>
      <rect x="96" y="578" width="6" height="56" rx="3" fill="#0E8C7F"/>
