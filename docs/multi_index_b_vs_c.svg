      <rect x="118" y="612" width="290" height="8" rx="4" fill="#0E8C7F" opacity="0.30"/>
    </g>

    <!-- sublabel -->
    <text x="96" y="656" font-size="12.5" fill="#64748B">ranked within each type · relevance layer = section order + counts</text>
