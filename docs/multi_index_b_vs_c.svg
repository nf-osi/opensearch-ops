      <path d="M882,178 L882,206 A48,9 0 0 0 978,206 L978,178" fill="#2563EB"/>
      <ellipse cx="930" cy="178" rx="48" ry="9" fill="#3B82F6"/>
      <text x="930" y="200" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Datasets</text>
    </g>
    <!-- Publications -->
