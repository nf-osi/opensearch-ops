      <ellipse cx="1130" cy="178" rx="48" ry="9" fill="#7C3AED"/>
      <path d="M1082,178 L1082,206 A48,9 0 0 0 1178,206 L1178,178" fill="#7C3AED"/>
      <ellipse cx="1130" cy="178" rx="48" ry="9" fill="#8B5CF6"/>
      <text x="1130" y="200" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Publications</text>
    </g>

    <!-- arrows into fusion node -->
    <path d="M730,215 L905,272" fill="none" stroke="#0E8C7F" stroke-width="1.8" marker-end="url(#arrowDark)"/>
    <path d="M930,215 L930,272" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowDark)"/>
    <path d="M1130,215 L955,272" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrowDark)"/>

