<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowDark" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="720" fill="#FBFCFE"/>

  <!-- ============ shared styles via inline attrs ============ -->
  <!-- colors: Tools #0E8C7F  Datasets #2563EB  Publications #7C3AED  fusion accent #EA580C -->

  <!-- ===================== PANEL B (left) ===================== -->
  <g>
    <!-- panel title -->
    <text x="60" y="56" font-size="22" font-weight="700" fill="#0F172A">Option B · Federated / grouped (≈ today)</text>

    <!-- search query box -->
    <rect x="170" y="84" width="280" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="195" cy="105" r="7" fill="none" stroke="#64748B" stroke-width="2"/>
    <line x1="200" y1="110" x2="206" y2="116" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <text x="218" y="110" font-size="15" fill="#334155">Search query</text>

    <!-- fan-out arrows -->
    <path d="M260,126 L150,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M310,126 L310,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M360,126 L470,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- index cylinders -->
    <!-- Tools -->
    <g>
      <ellipse cx="110" cy="178" rx="48" ry="9" fill="#0E8C7F"/>
      <path d="M62,178 L62,206 A48,9 0 0 0 158,206 L158,178" fill="#0E8C7F"/>
      <ellipse cx="110" cy="178" rx="48" ry="9" fill="#12A091"/>
      <text x="110" y="200" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tools</text>
    </g>
    <!-- Datasets -->
    <g>
      <ellipse cx="310" cy="178" rx="48" ry="9" fill="#2563EB"/>
      <path d="M262,178 L262,206 A48,9 0 0 0 358,206 L358,178" fill="#2563EB"/>
      <ellipse cx="310" cy="178" rx="48" ry="9" fill="#3B82F6"/>
      <text x="310" y="200" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Datasets</text>
    </g>
    <!-- Publications -->
    <g>
      <ellipse cx="510" cy="178" rx="48" ry="9" fill="#7C3AED"/>
      <path d="M462,178 L462,206 A48,9 0 0 0 558,206 L558,178" fill="#7C3AED"/>
      <ellipse cx="510" cy="178" rx="48" ry="9" fill="#8B5CF6"/>
      <text x="510" y="200" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Publications</text>
