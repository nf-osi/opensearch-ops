# Golden relevance set for the nf-publications SearchIndex (publication-grained).
#
# Each case maps a user query to the doi(s) that a *perfect* search SHOULD return,
# ordered best-first. This is ground truth for the benchmark, derived from the SOURCE
# table (syn16857542), NOT from what the current search happens to return.
#
# id_field is `doi`: the stored DOI string, matched verbatim by the runner. NOTE the
# source data stores DOIs inconsistently — some bare (`10.xxxx/...`), some prefixed
# (`https://doi.org/10.xxxx`). The values below are the EXACT stored strings so they
# resolve in the index. A handful of rows have malformed/duplicated DOIs (e.g. "eabo5442",
# "720", "S1534-..."); those are avoided in the heads where a clean sibling exists.
#
# type:  known-item = one defensible right answer (an exact paper the user re-finds).
#        topical    = discovery; several papers are legitimately relevant.

index:      syn75081631
index_name: nf-publications
version:    2026.07.30
k:          10
id_field:   doi
notes: |
  Every case carries `source` (+ `source_url` where there is a document to point at) so it
  can be traced back to whoever asked for it; all cases here are currently
  source: agent-generated.

  Every case also carries `last_reviewed` / `reviewer` — when an SME last signed off on that
  case's query and `relevant` set, and who. Per-case so cases can drift apart as they are
  re-reviewed individually; bump only the case you actually looked at. Distinct from any
  "verified live <date>" note, which records when the SEARCH was last probed rather than
  when the ground truth was blessed.

