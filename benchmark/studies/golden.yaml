  # scenarios against the NF Data Portal study search; its "Table Search" section
  # lists failed terms against the legacy MySQL full-text service, one of which
  # ('biobank') targets a study. Coverage of the page from this file:
  #
  #   Table Search / 'biobank'  -> biobank-generic (below)
  #   Scenario 1 (NTAP MRI, multi-keyword doesn't combine facets)
  #                             -> the EXISTING ntap-mri case, plus
  #                                ntap-and-mri-operator (below) for the 'AND' variant
  #   Scenario 3 (kinomics data, generic term hurts precision)
  #                             -> kinomics-data-generic-term (below)
  #   Scenario 4 (project title needs quotes)
  #                             -> study-title-unquoted (below)
  #   Scenario 2 (bare 'NTAP' returns non-NTAP studies)
  #                             -> NOT SCOREABLE HERE; see the note below.
  #
  # SCENARIO 2 — deliberately not a case. The complaint is PRECISION ("98 results
  # appear. The majority are NTAP but 2 CTF studies are listed and it is unclear
  # why"), and run.py only scores MRR / Recall@k / Hit@k against a `relevant` set —
  # it has no precision or graded-relevance metric, and the true pool is 101 studies
  # (fundingAgency HAS 'NTAP'), far past k=10, so any `relevant` head we picked would
  # produce a meaningless recall number. Recording the live diagnosis instead, since
  # it answers the page's "unclear why" (probed 2026-07-30, prod, frontend_default;
  # bare 'ntap' now returns 21 hits, not 98, of which 3 are not NTAP-tagged):
  #   syn20613866 (Neurofibromatosis Therapeutic Consortium - Brigham and Women's)
  #   syn21452685 (Neurofibromatosis Therapeutic Consortium - UCSF)
  #     -> NOT search bugs. Both are fundingAgency=[CTF] but their summaries say the
  #        collaboration "was co-funded with NTAP (Neurofibromatosis Therapeutic
  #        Acceleration Program)". The free-text match is correct; the FUNDER METADATA
  #        is incomplete. This is a curation fix, not a relevance fix.
  #   syn64500888 (Targeting PRMT5 in MTAP-deleted NF1 High Grade Gliomas)
  #     -> a REAL false positive, and the only one: the summary is about the MTAP
  #        gene, and fuzziness AUTO (which the frontend always sends) treats MTAP as
  #        1 edit from NTAP. Short all-caps acronyms are exactly where blanket
  #        fuzziness backfires. Fixing it means making fuzziness length-aware or
  #        conditional, which is a query-shape change worth benchmarking separately.
  # ---------------------------------------------------------------------------
  - id: biobank-generic
    query: biobank
    type: topical
    source: confluence-search-limitations
    source_url: "https://sagebionetworks.jira.com/wiki/spaces/PLFM/pages/3668508678/Examples+of+Limitations+of+Table+and+Portal+Search"
    last_reviewed: 2026-07-30
    reviewer: avu
    expected_pool: 9
    recall_gap_legacy_search: true
    recall_gap_current: false   # verified live 2026-07-30: 4/5 head in top 5 (ranks 1,2,3,5); syn71998358 not in top 20
    notes: >-
      From the page's Table Search list: the author searched 'biobank' and pointed at
      syn4939902 as the target, noting that its summary says "biospecimen and xenograft
      bank" — i.e. they expected a synonym/compound match. Verified against the source
      table (syn52694652): 'biobank' actually appears VERBATIM in that summary ("The goal
      of the JHU biobank project is to establish a biospecimen and xenograft bank"), so no
      synonym expansion is needed and the legacy miss was tokenization, not vocabulary.
      Source predicate: summary/studyName LIKE '%bank%' in the biorepository sense, 9 rows;
      `relevant` is the ideal head — the 5 studies whose CORE contribution is a
      bank/repository, ordered with the page's own target first. Prod ranks 4 of the 5 in
      the top 5. Excluded from the pool: syn11672851 (Drug-Target Explorer), which matches
      only on 'DrugBank', a database name — a false friend. Ranking-depth note: syn71998358
      falls outside the top 20 because it says "tissue bank and data bank", never the
      closed compound. Related but distinct: jhu-biobank-shorthand qualifies the query with
      'JHU' and is a known-item; this one is the bare ambiguous term.
    relevant:
      - syn4939902    # The Johns Hopkins NF1 biospecimen repository — the page's stated target; "the JHU biobank project"
      - syn9727752    # Synodos Schwannomatosis — "develop a clinically annotated schwannomatosis biobank"
      - syn53072189   # Uncovering the molecular landscape of cutaneous neurofibromas — "database (>10 years) and biobank for NF"
      - syn4984604    # Cutaneous Neurofibroma Data Resource — "the biobank enables comprehensive analysis of diverse NF samples"
      - syn71998358   # Establishing a Postmortem Donation Program for NF1-associated Cancers — "centralized tissue bank and data bank"

  - id: kinomics-data-generic-term
    query: kinomics data
    type: topical
    source: confluence-search-limitations
    source_url: "https://sagebionetworks.jira.com/wiki/spaces/PLFM/pages/3668508678/Examples+of+Limitations+of+Table+and+Portal+Search"
    last_reviewed: 2026-07-30
    reviewer: avu
    expected_pool: 3
    recall_gap_current: false   # verified live 2026-07-30: 2/3 at ranks 1-2 of 269 hits; syn51133914 not in top 20
    notes: >-
      Scenario 3 verbatim: "I want to search for kinomics data, so I type in the words
      'kinomics data'. Result - 268 results appear. Since I used the additional word 'data'
      this causes irrelevant results to appear ... Removing the word 'data' results in 3
      results." Source: dataType HAS ('kinomics') (3 rows), which matches the page's count
      of 3 exactly, so `relevant` is the COMPLETE pool and Recall@10 is exact. The point of
      the case is that the query keeps the useless word: a generic term the user naturally
      types must not dilute the specific one. Probed live 2026-07-30 — the dilution is
      unchanged: 'kinomics data' -> 269 total hits with 2/3 recovered, while bare 'kinomics'
      -> 5 total hits with 3/3 at ranks 1, 3, 5. Any strategy that fixes this (cross_fields,
      minimum_should_match, or a stopword-ish handling of 'data') should close the gap to
      bare 'kinomics'; that delta is the metric to watch.
    relevant:
      - syn8016599    # Modeling signaling networks of NF1-deficient Schwann cells ... mass spectrometry-based proteomics — dataType [geneExpression, kinomics]
      - syn51133914   # DHART SPORE Project 1 Phase 1 — Molecular, Developmental, and Genetic Evaluation of Plexiform Neurofibromas
      - syn2343195    # Synodos NF2 — kinomics is one of 7 dataTypes

  - id: study-title-unquoted
    query: Genetic studies of neurofibromatosis
    type: known-item
    source: confluence-search-limitations
    source_url: "https://sagebionetworks.jira.com/wiki/spaces/PLFM/pages/3668508678/Examples+of+Limitations+of+Table+and+Portal+Search"
    last_reviewed: 2026-07-30
    reviewer: avu
    expected_pool: 1
    recall_gap_current: false   # verified live 2026-07-30: rank #1 of 351 hits, unquoted AND lowercased
    notes: >-
      Scenario 4: the author could only find this study by wrapping the title in quotes —
      unquoted, and with the title's own capitalisation, it "still not listed as a
      candidate". Source: studyName LIKE '%Genetic Studies%' (1 row, syn11374339). The case
      is stated in the FAILING form on purpose: lowercase 'studies', no quotes. Prod now
      ranks it #1, and the quoted form ("Genetic Studies of Neurofibromatosis") also ranks
      #1, so quoting is no longer load-bearing — this is a regression guard for exact-title
      recall. Note the 351 total hits: every study matching 'neurofibromatosis' or 'studies'
      is in the tail, so #1 here is a ranking win, not a filtering one.
    relevant:
      - syn11374339   # Genetic Studies of Neurofibromatosis (NTAP, Cutaneous Neurofibroma Initiative)

  - id: ntap-and-mri-operator
    query: NTAP AND MRI
    type: topical
    source: confluence-search-limitations
    source_url: "https://sagebionetworks.jira.com/wiki/spaces/PLFM/pages/3668508678/Examples+of+Limitations+of+Table+and+Portal+Search"
    last_reviewed: 2026-07-30
    reviewer: avu
    expected_pool: 6
    recall_gap_current: false   # verified live 2026-07-30: syn17100988 at rank 16 of 127 — identical to bare 'ntap mri'
    notes: >-
      Scenario 1's boolean-operator variant. The user tried 'NTAP MRI', then 'NTAP + MRI',
      then 'NTAP AND MRI', expecting one of them to intersect the two concepts; on legacy
      search 'AND' actively hurt (104 results -> 283). Same intent and same `relevant` set
      as the ntap-mri case — this case exists only to measure what the OPERATOR SYNTAX does
      to the result set, which is a property no other case tests. Probed live 2026-07-30:
      'ntap mri', 'NTAP + MRI' and 'NTAP AND MRI' all return exactly 127 hits with the head
      study at rank 16, i.e. '+' and 'AND' are now tokenised away and harmlessly ignored
      rather than making things worse. The regression to guard against is a strategy change
      (e.g. simple_query_string, which DOES interpret '+' and 'AND') that silently gives
      these three spellings different behaviour. The underlying Scenario 1 complaint —
      neither spelling actually intersects funder AND method, so the head sits at rank 16
      instead of rank 1 — is still open and is what ntap-mri scores.
    relevant:
      - syn17100988   # The role of GABA in the working memory impairments in Neurofibromatosis Type 1
      - syn17098100   # Imaging predictors of malignant peripheral nerve sheath tumors
      - syn25999239   # Towards clinical translation of imaging studies in neurofibromatosis type 1
      - syn4939894    # Imaging Biomarkers of Neurofibromatosis Type 1-Associated Optic Pathway Glioma
      - syn29867701   # Multi-parametric Imaging Biomarker Development to Predict Malignant Conversion in Patients with Neurofibromatosis Type 1
      - syn26957643   # High-Resolution Ultrasonography and Optical Frequency Domain Imaging for Measurement and Characterization of Cutaneous Neurofibromas in Patients with NF1
