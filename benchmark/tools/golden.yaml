  # ---------------------------------------------------------------------------
  # Added from the PLFM Confluence page "Examples of Limitations of Table and
  # Portal Search" (Sage Platform space, page 3668508678; written late 2024,
  # last edited 2025-12-19):
  #   https://sagebionetworks.jira.com/wiki/spaces/PLFM/pages/3668508678/Examples+of+Limitations+of+Table+and+Portal+Search
  #   source: confluence-search-limitations
  #
  # The page's "Table Search" section lists search terms that FAILED against the
  # legacy MySQL full-text (TextMatchesQueryFilter) service, each with a link to a
  # Synapse table query showing the target the author knew existed. Every row below
  # comes from that table; the `relevant` sets were RE-DERIVED from the source table
  # (syn51730943) using the author's own predicate, not copied from the page.
  #
  # The page's original predicates, decoded from its query links:
  #   ipNF      -> resourceName LIKE '%ipnf%'      (9 rows)
  #   cagg      -> resourceName LIKE '%cagg%'      (2 rows)
  #   corielle  -> a typo for 'coriell'            (1 row)
  #   lambda    -> the page notes 'λ also doesn't work because it's too short'
  #   90-8      -> resourceName LIKE '%90-8%'; the page also tried '90.8'
  #   NF1+/R1947X pigs / minipigs -> Nf1pArg1947mp1
  # recall_gap_legacy_search: true on all of them — that is the page's whole point.
  # recall_gap_current re-verified live against prod OpenSearch (frontend_default
  # strategy: bare multi_match + fuzziness AUTO) on 2026-07-30.
  #
  # Three rows on the page have no case in THIS file:
  #   - 'biobank' targets a STUDY (syn4939902) -> lives in benchmark/studies/golden.yaml
  #     as biobank-generic.
  #   - 'whole genome sequencing' wants files with assay = WGS in the fileview
  #     syn16858331. There is no nf-files SearchIndex, so the file-level query is not
  #     scoreable, but the equivalent intent over curated datasets is already covered by
  #     the `whole-genome-sequencing` case in benchmark/datasets/golden.yaml. (The page
  #     also left this row's "actual results" cell empty, so it documents an intent
  #     rather than an observed failure.)
  #   - 'syn35632706' wants the files belonging to that project, i.e. a Synapse ID typed
  #     into a free-text box acting as an id lookup, again over syn16858331. OUT OF
  #     SCOPE and not reproducible anywhere in this benchmark: none of the nf- indexes
  #     are file-level, and this is arguably a routing concern (recognise a synID and
  #     navigate) rather than a relevance one. Revisit if an nf-files index is built.
  # ---------------------------------------------------------------------------
