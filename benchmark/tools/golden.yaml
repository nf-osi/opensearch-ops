    notes: >-
      The counter-case to quoted-mpnst-model, and the cleanest field-list case in the set.
      Ground truth = pdmModelSystemType = 'PDX (Patient-Derived Xenograft)' (12 rows, the
      complete pool, not a head). The phrase IS in the data — it is the literal value of
      `pdmModelSystemType`, a column added in the 2026-08 table revision — so the platform
      default, which sends no field list and therefore searches everything, retrieves all
      12 (ranks 3-14 of 14; Recall@10 = 0.67, held off rank 1 only by two red herrings whose
      description uses the phrase: NCC-MPNST3-X2 c8a807e4 and UCD65 07d262bf). Every
      strategy with an explicit field list, production_current included, scores ZERO here:
      not because the data is missing but because fields.yaml does not list the column.
      The exception is multi_match_cross, which ignores the quotes and matches the two rows
      whose resourceName contains 'xenografts'. Probed live 2026-09-09.
      Shares its pool with the `pdx` case above, which measures the SHORTHAND and does not
      fail — the abbreviation is in the names, the expansion is only in the new column.
      Read the two together; do not read their recall as independent evidence.
