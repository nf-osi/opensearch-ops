      in prod, because the driver is written as one closed compound token (CAGGCre-ERTM) and
      the standard analyzer never splits it — 'cagg' is neither a whole token nor a token
      prefix that a match query can reach, and fuzziness AUTO does not help (deletion of 3+
      characters). Probed live: 'CAGGCre' -> 2 hits (both, ranks 1-2), 'CAGGCre-ERTM' -> 3.
      So the resources ARE indexed and findable by the full driver name; only the shorthand
      fails. Fixing this needs an analyzer change (edge_ngram / word_delimiter on
      resourceName), not boost tuning — the same class of fix as the other intra-token
      shorthand cases, and the strongest remaining argument for one.
    relevant:
