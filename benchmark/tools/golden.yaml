# Golden relevance set for the nf-tools SearchIndex.
#
# Each case maps a user query to the resourceId(s) that SHOULD be retrieved.
# This file is meant to be reviewed and grown by subject matter experts (SMEs).
#
# How to add or curate a case:
#   - query:    what the user types into search.
#   - relevant: the resourceId(s) of the tool(s) that genuinely answer that query.
#               Find a resourceId by searching, e.g.:
#                 python3 query.py '{"query":{"match":{"resourceName":{"query":"ScienCell Schwann"}}},"size":5}'
#               and copy the resourceId of each correct result.
#   - type:     known-item = one defensible right answer (exact name / RRID / synonym).
#               topical    = several tools are relevant; needs SME curation before its
#                            recall numbers can be trusted.
#               These map onto the standard search (information-retrieval) taxonomy — for
#               SMEs who aren't search specialists:
#                 known-item ≈ "navigational" / lookup search — the user has ONE specific
#                              tool in mind and wants to re-find it.
#                 topical    ≈ "informational" / exploratory (discovery) search — the user
#                              explores what tools exist on a topic; many can be relevant.
#               Refs: Broder, "A taxonomy of web search," ACM SIGIR Forum 2002 (the
#               navigational/informational/transactional split); Marchionini, "Exploratory
#               search: from finding to understanding," CACM 2006 (lookup vs exploratory)
#               NOTE: a couple of the known-item cases (e.g. `name-exact-schwann`,
#               `rrid-lookup-cvcl8478`) are essentially SANITY CHECKS — exact full-name /
#               RRID lookups that should rank #1 on any sane config. They confirm the
#               harness and index are working; they don't discriminate between strategies.
#   - notes:    free text — why these are the right answers, edge cases, caveats.
#
# Optional fields (used by some cases, ignored by the runner — for SME context and
# future graded-relevance / nDCG scoring):
#   - expected_pool: SME estimate of how many tools in the registry truly match the
#                    query. For topical cases the `relevant` list is just the ranked
#                    HEAD of this pool, so Recall@k is a floor, not the full picture.
#   - entity_types:  the kinds of tool the expected results are (Cell Line, Antibody, …).
#   - source / source_url: where the case came from, so a case can be traced back to
#                    the person or document that asked for it. Current values:
#                    agent-generated, manual, NF_tool_search_benchmarking_spreadsheet,
#                    kg-pipeline-eval, confluence-search-limitations (see the section
#                    comments below for each batch).
#   - last_reviewed / reviewer: when an SME last signed off on this case's query and
#                    `relevant` set, and who. Per-case (not per-file) so cases can drift
#                    apart as they are re-reviewed individually — bump only the case you
#                    actually looked at. NOTE this is about SME sign-off on the ground
#                    truth, which is separate from the "verified live <date>" notes on
#                    recall_gap_current, which record when the SEARCH was last probed.
#   - recall_gap_legacy_search: true = the LEGACY search (MySQL TEXT_MATCHES) failed on these queries
#   - recall_gap_current: a Hit@20 flag — does AT LEAST ONE relevant item appear in the
#                    top 20 hits? true = NONE do (the search surfaces nothing relevant
#                    where the user would look — a real recall gap). 
#                    false = at least one relevant item reaches the top 20, so
#                    the expected results ARE discoverable; surfacing MORE of them or
#                    ranking them higher is a separate ranking-depth concern (better
#                    measured by Recall@20 / nDCG), not this flag. Verified live. (Top 20
#                    is a deliberately strict bar: in prod the first results page shows
#                    25 hits, so 20 is slightly stricter than "on page 1".) The `relevant`
#                    order encodes the ideal ranking.

index: syn75081636
index_name: nf-tools
version: '2026.09.09'
k: 10
# id_field: which column the `relevant` ids below come from, i.e. what the runner
# matches hits on. resourceId is the nf-tools identifier; other portals/tables differ
# (an accession, a Synapse id, …). Use "rowId" to match on the index's own per-row id
# when no column is a stable identifier.
id_field: resourceId

