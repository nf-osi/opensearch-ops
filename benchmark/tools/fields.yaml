# People:
#   - "institution"                 # fill 194/1218 = 16% · companion to investigatorName; affiliation search
#
# Deliberately excluded (not useful as free-text match targets):
#   identifiers ............ resourceId, investigatorSynapseId, orcid, biobankURL, downloadURL
#   boilerplate / contact .. howToAcquire (fill 99%), usageRequirements (62%),
#                            contact (0.1%), licenseType (0.2%). howToAcquire is the
#                            most-filled text column in the table after resourceName,
#                            and it is the ONLY place some tools name their originating
#                            investigator — but see the note below before adding it.
#   dates / age ............ dateAdded, dateModified, latestPublicationDate, age
#   faceting-only flags .... completenessCategory, availabilityCategory, criticalInfoCategory,
