# Per-table field config for the nf-tools benchmark.
#
# The shared strategy functions (benchmark/strategies.py) are table-agnostic; the
# table-specific part — which columns to match and how much each is boosted — lives here.
# run.py loads benchmark/<table>/fields.yaml and passes the fields to the strategies. A
# table without a fields.yaml falls back to searching all fields (all fields, no boosts).
#
# `fields` is the match list with per-field boosts: "field^N" means a match in `field`
# counts N times an unboosted field (omit "^N" for weight 1). The unboosted ("flat")
# variant used by the equal-weight strategies (simple_query_string, multi_match_best) is
# derived automatically by stripping the boosts — no need to list the fields twice.
# Tune these weights and re-run; this is one of the main levers the harness exists to test.
#
# This file may also carry an optional `query:` block describing a full tuned query shape
# (query type, tie_breaker, minimum_should_match, phrase_boost), which run.py compiles into
# a `tuned` strategy — see benchmark/studies/fields.yaml for a worked example and the tuner
# README's "Applying a winner". nf-tools has no block yet: its boosts below are hand-curated
# and every strategy here is one of the fixed shapes.
#
# NOTE: a multi_match/simple_query_string with an explicit `fields` list searches ONLY
# these columns — the other 58 columns are invisible to every strategy except
# `frontend_default` (which sends no field list and so searches all fields). Commented
# entries below are candidates you can uncomment to widen coverage.
#
# Column names audited 2026-09-09 against the source table's column model
# (`/entity/syn51730943/column`, 70 columns), which is authoritative: the index is
# `SELECT * FROM syn51730943`, so a name absent there is a silent no-op in every query.

# ---------------------------------------------------------------- the control
# Which strategy this table is measured against. nf-tools is the one NF index whose portal
# page sets a SearchQueryConfig, so its control is what that config sends (below), NOT the
# platform default — comparing a candidate to `frontend_default` here would claim credit
# for a change production already shipped. The 12 indexes with no config keep
# `control: frontend_default` (the default when this key is absent).
control: production_current

# What the nf-tools portal page actually sends today. Transcribed from
# apps/portals/nf/src/config/resources.ts:49 `toolsSearchQueryConfig` (wired at
# synapseConfigs/tools.tsx:121), synapse-web-monorepo @ ec83a0164ae (2026-09-03).
# run.py compiles this into the `production_current` strategy, including the
# quoted-phrase / Synapse-id routing to simple_query_string that runs ahead of the
# queryStrategy switch. Re-check against resources.ts whenever the portal is redeployed;
# these boosts are deliberately NOT the same as `fields:` below — the delta between them
# is the headroom the benchmark exists to measure.
production:
  query_strategy: MULTI_MATCH_BEST_FIELDS   # no fuzziness: the config sets none
  fields:
    - "resourceName^5"
    - "synonyms^4"
    - "rrid^4"
    - "targetAntigen^2"
    - "geneticDisorder"
    - "description"

fields:
  # identity / names — strongest signal
  - "resourceName^5"
  - "synonyms^4"
  - "rrid^4"
  # antibody target
  - "targetAntigen^3"
  # disease / phenotype / manifestation — discovery.
  # `manifestation` and `geneticDisorder` are the unified columns the source table moved to;
  # they replace the per-resource-type names (cellLineManifestation, animalModelOfManifestation,
  # diseaseType, cellLineGeneticDisorder, animalModelGeneticDisorder) this file used to list,
  # none of which exist on syn51730943 any more.
  - "manifestation^3"
  - "geneticDisorder^2"
  - "tumorType^2"
  # organism / kind / modality — discovery
  - "species^2"
  - "cellLineCategory^2"
  - "resourceType^2"
  - "vectorType^2"
  # TUNED to 5 on 2026-09-09 — Swept 1..5 on resourceName and 2/5/8 here against the
  # full 66-case nf-tools golden: raising this field 2 -> 5 improves investigator-related queries
  # that also include a resource type such as "mouse", with no downsite; ^8 overshoots (0.737 / 0.687), 
  # so 5 is the measured optimum. Better than initial intuitive fix: lowering `resourceName`
  # from ^5 is does not help until until ^2, and by then it costs the known-item and topical cases. 
  # With competing signals, what decides the outcome is the ratio between the two fields, 
  # not resourceName's absolute weight.
  - "investigatorName^5"
  # donor demographics — unboosted. Narrow, sparsely filled columns (race ~11%, sex on most
  # cell lines) that only matter when the user names them, e.g. the nf1-cell-line-black case
  # ('nf1 cell line black patient'). Left at weight 1 deliberately: boosting them would let a
  # stray 'male'/'female' token outrank a name match on the ~200 rows carrying each value.
  - "race"
  - "sex"
  # free text — weight 1
  - "description"

# Candidate fields NOT currently searched — uncomment (with a boost) to include.
# The source table gained ~24 columns in the 2026-08 revision (new resource types: PDX/PDM
# models, organoids, computational tools/software, clinical assessments), so this list is
# longer than it was. Left out of the default set pending SME
