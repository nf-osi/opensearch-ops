#   - "insertSpecies"               # fill 122/1218 = 10%
#   - "selectableMarker"            # fill 22/1218 = 2% · NEW; genetic reagent
#   - "resistance"                  # DO NOT ADD — also empty, 0 of 1218 rows
#                                   # (measured 2026-09-09).
#   - "backgroundStrain"            # fill 80/1218 = 7% · animal-model strain
#   - "backgroundSubstrain"         # fill 37/1218 = 3%
#   - "animalState"                 # fill 126/1218 = 10% · NEW; enumeration
