id_field:   pmid
# id_field rationale: the source table (syn51735450) has 1892 rows but only ~655 distinct
# publications — each publication is duplicated once per associated resource/usage
# (usageId is unique per row, resourceId/publicationId repeat). pmid is 100% filled and
# identifies the *publication*, which is the unit of relevance here, so it is the correct
# id_field. usageId/rowId would fragment one relevant paper across many duplicate rows.
# pmid is stored verbatim as in the source: mostly "PMID:<n>", with 2 recent rows as bare
# "<n>". The runner/validator match hits' pmid value, and multiple index docs may share a
# pmid — any hit carrying a relevant pmid counts.

