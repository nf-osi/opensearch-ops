# Build and publish the dashboard from committed benchmark results.
#
# Enable GitHub Pages with Settings → Pages → Build and deployment → GitHub Actions.
name: pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time without cancelling an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build site
        run: python3 build_site.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
