# Run a benchmark for a table with a golden relevance set.
#
# Queries hit the public Synapse repo-prod API anonymously (no secrets needed).
name: benchmark

on:
  workflow_dispatch:
    inputs:
      table:
        description: Benchmark table
        required: true
        type: choice
        default: tools
        options:
          - datasets
          - publications
          - studies
          - tools
          - usage-publications

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Run benchmark
        run: python3 benchmark/run.py "${{ inputs.table }}" --label latest

      - name: Create results review pull request
        # The action creates or updates one PR and stages only the generated result file.
        # Publishing remains separate: publish.yml deploys results after review and merge.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/benchmark-results-${{ inputs.table }}
          delete-branch: true
          commit-message: Update ${{ inputs.table }} benchmark results
          title: Update ${{ inputs.table }} benchmark results
          body: |
            Automated `${{ inputs.table }}` benchmark run for review.

            Review the metric and per-case changes before merging. The publishing workflow
            deploys the committed result after merge.
          add-paths: benchmark/${{ inputs.table }}/results/latest.json
