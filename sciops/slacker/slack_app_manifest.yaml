display_information:
  name: search-sciops-bot
  description: Search-relevance assistant (goldens, tuning). Mention with what you need.
features:
  bot_user:
    display_name: search-sciops-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - files:write
      - channels:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
