# What the published dashboard includes.
#
# build_site.py reads this file instead of globbing benchmark/<table>/results/*.json, so
# dropping a scratch run into results/ can never quietly change the published site — a
# run appears on the dashboard only if it is named here AND committed to git (CI builds
# from a fresh checkout, so an untracked results file does not exist as far as the
# published site is concerned; `python3 build_site.py` warns about both cases).

# ---------------------------------------------------------------- the run of record
# run.py's default label, and the run every index opens on. Published for every table
# that has it; a table without it renders the "no scored run committed yet" state.
#
#   python3 benchmark/run.py <table>                 # writes results/latest.json
#   python3 benchmark/run.py <table> --label latest  # the same thing, explicitly
headline: latest

# ---------------------------------------------------------------- extra runs
# Additional labels to publish per table, in the order they should appear in the
# dashboard's run switcher (after the headline). Use this for a run that earns a place
# next to the run of record — a tuning winner, a before/after pair for a config change —
# not for every experiment that happens to be on disk.
#
# None currently.
extra_runs:

# ---------------------------------------------------------------- held-constant rows
# A run measures every strategy against ONE index state, because index configuration is a
# property of the index, not of a query. That is usually what you want — but not for the
# platform default, which is defined as "no customization at all". Measured on an index
# that HAS a search config bound, `frontend_default` is the default query on a customized
# index, which is a different thing and reads worse than the real default.
#
# `constant:` pins one strategy's row to a fixed index state by taking it from another run
# of the same table, so re-scoring the headline against today's configuration cannot move
# it. The runs in results/ stay untouched — the substitution happens at build time, so
# re-running run.py cannot silently revert it — and the published payload records where the
# row came from so the dashboard can mark it rather than passing it off as same-run.
#
#   <table>:
#     <strategy>: <label to take that strategy's row from>
#
# (Not to be confused with `control:` in a table's fields.yaml, which names the strategy
# the rest of a run is READ against. This one is about which run a row is measured in.)
constant:
  tools:
    # nf-tools is bound to nf_tools_search_config, so `latest` measures the platform default
    # against a configured index — which reads worse than the real default. The `unbound` run
    # is the same golden and the same boosts scored with the config unbound (see its
    # search_config_id: null), so take the row from there and the control means what it says.
    # No numbers quoted here on purpose: both runs move whenever either is re-scored.
    frontend_default: unbound

# ---------------------------------------------------------------- promoted to production
# Which arm of a run measures what is actually DEPLOYED, when a tuning result has been
# promoted. This cannot be derived from the repo: config/ only shows that a configuration
# is version-controlled, not that it is bound in production (`python3 config/config.py
# check` reports binding), and an index whose portal ships no SearchQueryConfig has no
# `production_current` arm at all even when its index-side configuration is live.
#
# Recording it lets the dashboard say "this is what users get" about the right row, and
# mark the case where the best arm tested is the one already running — the useful negative
# result, which otherwise reads as "no gain available" with no explanation.
#
#   <table>:
#     as:    <strategy key>    the run row that measures the deployed state
#     at:    <YYYY-MM-DD>      when it went live (optional)
#     note:  <sentence>        anything the two above cannot say (optional)
#
# `as:` is usually `production_current`, once `production:` in the table's fields.yaml has
# been re-transcribed and the table re-scored. It can also name the experiment arm that
# measures the shape just deployed — that lets a promotion be recorded the moment it goes
# live, without waiting for a re-run. The run's own `production_current` row then measures
# the configuration that was replaced, and the dashboard marks it as pre-promotion rather
# than letting it keep the label.
#
# The build drops an entry whose `as` is not a strategy in the headline run, and says so.
# It also compares `at:` with the run's date and warns when the two have drifted apart:
# a run scored before the promotion cannot measure it, and once a run postdates the
# promotion, `as:` should be back to `production_current`.
promoted:
  datasets:
    # nf-datasets ships no fields.yaml and no `production:` block, so the run has no
    # `production_current` arm — but the index itself is bound to nf_datasets_search_config
    # (custom analyzers + synonym routing per column). The default query measured against
    # that configuration IS what users get, so `frontend_default` is this index's
    # production row, not its platform-default control.
    as: frontend_default
    # the day config/nf_datasets_search_config.json was committed (9723662) — correct this
    # if the configuration was bound to syn75081630 on a different day
    at: 2026-07-10
    # `note:` is rendered on the dashboard, so keep it in the reader's terms — the
    # maintainer's version of the last sentence is: score it unbound and splice the row in
    # via `constant:` above, the way tools/frontend_default does.
    note: >-
      No query-side arm tested beats the default query running on this configuration.
      Reporting a true platform-default number for this index would need a run measured
      with the configuration unbound.

  tools:
    # Recorded the day the portal config changed, before `production:` in
    # benchmark/tools/fields.yaml is re-transcribed and the table re-scored — so `as:`
    # names the arm that measures the shape now deployed, not the production_current row,
    # which still measures the best-fields configuration it replaced. Re-transcribe and
    # re-run, then set `as: production_current`; the build warns once a run postdates the
    # date below.
    as: multi_match_cross
    at: 2026-09-11
    note: >-
      Cross-fields matching over the benchmark's curated field boosts, replacing the
      portal's best-fields configuration.

# ---------------------------------------------------------------- deliberately excluded
# Runs that exist in results/ and are NOT published, with the reason. Build
# prints excluded runs as expected, and warns only about runs it finds in results/ that
# appear in neither `extra_runs` nor here.
excluded:
  tools:
    # Not a run of the portal's search: it measures nf-tools with its SearchConfiguration
    # unbound, which is a state the portal is never in. It exists so `frontend_default` has an
    # honest platform-default number, and it reaches the dashboard only through `constant:`
    # above — as one row, marked, rather than as a run someone could mistake for production.
    unbound: measures the index with its config unbound; spliced in via `constant:` instead

